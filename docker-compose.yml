services:
  mysql:
    image: mysql:8.4
    container_name: cineplus_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cineplus123
      MYSQL_DATABASE: cineplus
      MYSQL_USER: cineplus
      MYSQL_PASSWORD: cineplus123
    ports:
      - "3306:3306"
    volumes:
      - cineplus_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcineplus123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cineplus_mysql_data:
